replicaCount: 1
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
containerPort: 80
# Liveness: process-only check, no dependency calls - failing it kills the container.
livenessPath: /health
# Readiness: can check dependencies (DB, etc) - failing it just pulls the pod out of
# the Service's endpoints, no restart.
readinessPath: /health/ready
# Secrets to pull from Doppler via the shared ClusterSecretStore, each
# landing in one container env var. Example:
# secrets:
#   - envName: DATABASE_URL
#     dopplerKey: USER_SERVICE_DB_URL
secrets: []
# Map for non-sensitive plaintext environment variables
env: {}
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "250m"
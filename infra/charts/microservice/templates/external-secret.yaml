{{- if .Values.dopplerSecretKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secret
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: doppler-cluster-store
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-secret
    # 'Owner' means if the ExternalSecret is deleted, the K8s Secret is deleted too
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: {{ .Values.dopplerSecretKey }}
{{- end }}
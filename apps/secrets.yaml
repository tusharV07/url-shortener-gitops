apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  annotations:
    # Must exist before infra-stack's ExternalSecret can resolve
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: url-shortener
  source:
    repoURL: 'https://github.com/tusharV07/url-shortener-gitops.git'
    path: infra/secrets
    targetRevision: v1.0.0
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

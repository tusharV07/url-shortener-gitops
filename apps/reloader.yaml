apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: url-shortener
  source:
    repoURL: 'https://stakater.github.io/stakater-charts'
    chart: reloader
    targetRevision: 2.2.19
    helm:
      values: |
        reloader:
          # Scoped to this namespace only - avoids a ClusterRole/ClusterRoleBinding
          watchGlobally: false
          namespaces:
            - url-shortener
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

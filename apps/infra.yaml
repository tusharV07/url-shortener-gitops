apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-stack
  namespace: argocd
spec:
  project: url-shortener
  source:
    repoURL: 'https://github.com/tusharV07/url-shortener-gitops.git'
    path: infra/stateful
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
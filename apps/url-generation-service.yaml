apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-generation-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tusharV07/url-shortener-gitops.git'
    path: infra/charts/microservice
    targetRevision: HEAD
    helm:
      parameters:
        - name: image.repository
          value: url-generation-service
        - name: image.tag
          value: v1
        - name: containerPort
          value: "5003"
        - name: dopplerSecretKey
          value: URL_GEN_DB_URL
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
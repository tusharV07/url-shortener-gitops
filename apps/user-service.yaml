apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service
  namespace: argocd
spec:
  project: url-shortener
  source:
    repoURL: 'https://github.com/tusharV07/url-shortener-gitops.git'
    path: infra/charts/microservice
    targetRevision: HEAD
    helm:
      parameters:
        - name: image.repository
          value: user-service
        - name: image.tag
          value: v1
        - name: containerPort
          value: "5001"
      values: |
        secrets:
          - envName: DATABASE_URL
            dopplerKey: USER_SERVICE_DB_URL
        env:
          KAFKA_BOOTSTRAP_SERVERS: "kafka.infra.svc.cluster.local:9092"
          KAFKA_TOPIC: "users-events"
          KAFKA_CLIENT_ID: "user-service"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
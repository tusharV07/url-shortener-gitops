apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # The operator (CRDs + controller) must exist before secret-store's
    # ClusterSecretStore can resolve
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: url-shortener
  source:
    repoURL: 'https://charts.external-secrets.io'
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      # Pinned to match the release name of the pre-existing manual `helm install`,
      # so this adopts the live resources in place instead of creating duplicates.
      releaseName: external-secrets
      values: |
        installCRDs: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
